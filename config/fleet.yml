# The fleet and network are TEMPLATE-DEFINED configuration, not code.
# Adding a truck model = adding an entry here. Zero Python files change,
# and CI proves it (tests/test_config.py instantiates a fleet from a
# fixture template with an extra model).
depot: {lat: 43.05, lon: -76.15}

zones:                       # route corridors (center lat/lon)
  NORTH: {lat: 43.55, lon: -76.10}
  SOUTH: {lat: 42.60, lon: -76.20}
  EAST:  {lat: 43.05, lon: -75.20}
  WEST:  {lat: 43.00, lon: -77.10}
  NE:    {lat: 43.45, lon: -75.40}
  SW:    {lat: 42.70, lon: -76.90}

fleet:                       # a truck model is an asset class; onboarding one
  - {name: Sprinter, max_weight_kg: 1500,  max_cube_m3: 12.0, cost_per_km: 0.50, count: 18}
  - {name: BoxTruck, max_weight_kg: 4500,  max_cube_m3: 28.0, cost_per_km: 0.80, count: 18}
  - {name: Semi,     max_weight_kg: 15000, max_cube_m3: 75.0, cost_per_km: 1.40, count: 14}

hos:                         # simplified FMCSA model (labeled as such)
  max_drive_min: 660         # 11 hours driving
  max_duty_min: 840          # inside a 14-hour on-duty window

shifts:
  starts: [240, 300, 360, 420, 480]   # 04:00–08:00
  length_min: 840
  drivers: 20
